name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned authoritative dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify generated derivatives and tests
        run: python -m pytest
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Build installable generator wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
