<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Three AI governance agent implementation patterns</title>
  <desc id="desc">A comparison of the no-connection Guidance Agent, Copilot Studio Structured Assessment Agent, and MCP-backed Assistant across infrastructure, deterministic behavior, and maintenance.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f7f9fc; }
    .card { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
    .track-a { fill: #dbeafe; stroke: #2563eb; }
    .track-b { fill: #ede9fe; stroke: #7c3aed; }
    .mcp { fill: #dcfce7; stroke: #16a34a; }
    .title { fill: #142033; font: 700 34px system-ui, sans-serif; }
    .heading { fill: #142033; font: 700 24px system-ui, sans-serif; }
    .body { fill: #334155; font: 18px system-ui, sans-serif; }
    .label { fill: #475569; font: 700 15px system-ui, sans-serif; letter-spacing: 1.2px; }
    .rule { stroke: #cbd5e1; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .card { fill: #111827; stroke: #475569; }
      .track-a { fill: #172554; stroke: #60a5fa; }
      .track-b { fill: #2e1065; stroke: #c4b5fd; }
      .mcp { fill: #052e16; stroke: #86efac; }
      .title, .heading { fill: #f8fafc; }
      .body, .label { fill: #dbe4ef; }
      .rule { stroke: #475569; }
    }
  </style>
  <rect class="bg" width="1400" height="760" rx="24"/>
  <text class="title" x="65" y="66">Choose the least complex pattern that meets the decision need</text>

  <rect class="card track-a" x="65" y="110" width="390" height="570" rx="22"/>
  <text class="label" x="100" y="150">TRACK A</text>
  <text class="heading" x="100" y="188">Guidance Agent</text>
  <text class="body" x="100" y="225">Instructions + uploaded knowledge</text>
  <line class="rule" x1="100" y1="250" x2="420" y2="250"/>
  <text class="label" x="100" y="288">INFRASTRUCTURE</text>
  <text class="body" x="100" y="320">No external connection</text>
  <text class="label" x="100" y="370">BEST FOR</text>
  <text class="body" x="100" y="402">Control education</text>
  <text class="body" x="100" y="432">Guided intake</text>
  <text class="body" x="100" y="462">Fact summaries</text>
  <text class="label" x="100" y="512">LIMIT</text>
  <text class="body" x="100" y="544">Does not calculate an</text>
  <text class="body" x="100" y="574">authoritative risk tier</text>
  <text class="label" x="100" y="630">START HERE</text>

  <rect class="card track-b" x="505" y="110" width="390" height="570" rx="22"/>
  <text class="label" x="540" y="150">TRACK B</text>
  <text class="heading" x="540" y="188">Structured Assessment</text>
  <text class="body" x="540" y="225">Copilot Studio rule-based flow</text>
  <line class="rule" x1="540" y1="250" x2="860" y2="250"/>
  <text class="label" x="540" y="288">INFRASTRUCTURE</text>
  <text class="body" x="540" y="320">Microsoft platform only</text>
  <text class="label" x="540" y="370">BEST FOR</text>
  <text class="body" x="540" y="402">Repeatable tiering</text>
  <text class="body" x="540" y="432">Known internal users</text>
  <text class="body" x="540" y="462">Low-code operations</text>
  <text class="label" x="540" y="512">LIMIT</text>
  <text class="body" x="540" y="544">Derived logic must be</text>
  <text class="body" x="540" y="574">versioned and revalidated</text>
  <text class="label" x="540" y="630">ADD WHEN NEEDED</text>

  <rect class="card mcp" x="945" y="110" width="390" height="570" rx="22"/>
  <text class="label" x="980" y="150">ADVANCED PATTERN</text>
  <text class="heading" x="980" y="188">MCP-backed Assistant</text>
  <text class="body" x="980" y="225">Hosted reusable decision service</text>
  <line class="rule" x1="980" y1="250" x2="1300" y2="250"/>
  <text class="label" x="980" y="288">INFRASTRUCTURE</text>
  <text class="body" x="980" y="320">HTTPS, auth, operations</text>
  <text class="label" x="980" y="370">BEST FOR</text>
  <text class="body" x="980" y="402">Centralized decisions</text>
  <text class="body" x="980" y="432">Multiple AI clients</text>
  <text class="body" x="980" y="462">One maintained engine</text>
  <text class="label" x="980" y="512">LIMIT</text>
  <text class="body" x="980" y="544">Requires connector approval</text>
  <text class="body" x="980" y="574">and service ownership</text>
  <text class="label" x="980" y="630">CENTRALIZE LATER</text>
</svg>
